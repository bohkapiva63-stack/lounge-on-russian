name: Build Russian APK

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          
      - uses: gradle/actions/setup-gradle@v3
      
      - uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml
          
      - run: pnpm install --frozen-lockfile
        working-directory: companion
        
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, wasm32-unknown-unknown
          
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            plugins
            
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      
      - name: Setup Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          
      - name: Build Plugins
        run: tools/plugins/build.sh
        
      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease
        working-directory: android
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lounge-ru-apk
          path: android/app/build/outputs/apk/release/*.apk
